<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>মেসার্স রহিমা ট্রেডার্স</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,"Noto Sans Bengali",sans-serif;
background:#f5f7f6;
color:#17202a;
line-height:1.7;
}

header{
background:#075b3a;
color:white;
padding:15px 20px;
position:sticky;
top:0;
z-index:10;
box-shadow:0 3px 12px #0003;
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.logo{
font-size:22px;
font-weight:bold;
}

nav a{
color:white;
text-decoration:none;
margin:0 7px;
font-size:14px;
font-weight:bold;
}

nav a:hover{
color:#ffd34e;
}

.hero{
background:linear-gradient(135deg,#064d31,#0b8055);
color:white;
text-align:center;
padding:90px 20px;
}

.hero h1{
font-size:44px;
margin-bottom:12px;
}

.hero p{
font-size:20px;
max-width:700px;
margin:auto;
}

.badge{
display:inline-block;
border:1px solid #ffffff55;
padding:7px 15px;
border-radius:30px;
margin-bottom:18px;
}

.buttons{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-top:28px;
}

.btn{
display:inline-block;
padding:13px 23px;
border-radius:9px;
text-decoration:none;
font-weight:bold;
}

.primary{
background:#ffd34e;
color:#17202a;
}

.secondary{
border:1px solid white;
color:white;
}

.section{
max-width:1100px;
margin:auto;
padding:60px 20px;
}

.title{
text-align:center;
color:#075b3a;
font-size:30px;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#667;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:24px;
}

.card{
background:white;
padding:30px;
border-radius:16px;
box-shadow:0 6px 22px #00000012;
border:1px solid #e5ebe8;
}

.card h3{
color:#075b3a;
font-size:22px;
margin-bottom:8px;
}

.icon{
font-size:40px;
margin-bottom:8px;
}

.features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.feature{
background:#075b3a;
color:white;
padding:25px;
border-radius:14px;
text-align:center;
}

.contact{
background:#eaf5ef;
}

.contact-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.contact-card{
background:white;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 18px #0001;
}

.contact-card a{
color:#075b3a;
font-weight:bold;
text-decoration:none;
}

.cta{
background:linear-gradient(135deg,#0b8055,#064d31);
color:white;
text-align:center;
border-radius:20px;
padding:45px 20px;
}

.cta h2{
font-size:30px;
margin-bottom:8px;
}

footer{
background:#10251d;
color:white;
text-align:center;
padding:28px 20px;
}

@media(max-width:750px){

.nav{
flex-direction:column;
}

nav{
text-align:center;
}

font-size:13px;
margin:0 4
